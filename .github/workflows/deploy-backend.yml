name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - 'zutility-be/**'
      - 'deploy/apply-migrations.sh'
      - 'deploy/remote-deploy.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-08ae36b488bdfb102
  BUCKET: zutility-deploy-381492245784

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492245784:role/zutility-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Package
        run: |
          set -euo pipefail
          tar -czf backend.tgz \
            zutility-be/src \
            zutility-be/migrations \
            zutility-be/Cargo.toml \
            zutility-be/Cargo.lock \
            deploy/apply-migrations.sh \
            deploy/remote-deploy.sh
          sha256sum backend.tgz | cut -d' ' -f1 > backend.sha256
          aws s3 cp backend.tgz "s3://$BUCKET/backend/$GITHUB_SHA.tgz"
          echo "sha $(cat backend.sha256), size $(stat -c %s backend.tgz) bytes"

      - name: Deploy over SSM
        run: |
          set -euo pipefail
          SHA=$(cat backend.sha256)
          URL=$(aws s3 presign "s3://$BUCKET/backend/$GITHUB_SHA.tgz" --expires-in 900)
          REMOTE=$(cat <<EOF
          set -eu
          cd /opt/zutility
          curl -fsSL "$URL" -o /tmp/backend.tgz
          echo "$SHA  /tmp/backend.tgz" | sha256sum -c -
          tar -xzf /tmp/backend.tgz
          /opt/zutility/deploy/remote-deploy.sh /tmp/backend.tgz
          EOF
          )
          PARAMS=$(jq -n --arg command "$REMOTE" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --timeout-seconds 1800 \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "ssm command $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text >&2 || true

          if [ "$STATUS" != "Success" ]; then
            echo "deploy finished with status $STATUS" >&2
            exit 1
          fi
